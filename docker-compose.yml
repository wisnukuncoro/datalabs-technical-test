x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-google==10.17.0
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/service-account.json
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./gcp:/opt/airflow/gcp:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Kuncoro --lastname Jati \
          --role Admin --email wisnujati29@gmail.com
        airflow variables set gcp_project_id "$${GCP_PROJECT_ID:-ecommerce-analytics}"
        airflow variables set bq_location "$${BQ_LOCATION:-asia-southeast2}"
        airflow variables set gcs_landing_bucket "$${GCS_LANDING_BUCKET:-ecommerce-analytics-landing}"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
