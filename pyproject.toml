[project]
name = "ecommerce-analytics-pipeline"
version = "0.1.0"
description = "Batch and streaming data engineering pipeline for e-commerce sales analytics"
authors = [
    { name = "Kuncoro Wisnu Jati", email = "wisnujati29@gmail.com" }
]
requires-python = ">=3.10"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
